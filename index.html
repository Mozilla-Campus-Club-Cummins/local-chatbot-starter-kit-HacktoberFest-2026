<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="chat-container">
    <header class="chat-header">
      <h2>Local AI Assistant</h2>
      <button id="theme-toggle">🌙 Dark/Light mode</button>
    </header>

    <div id="chat-window">
      <div class="message ai">
        <span class="message-text">
          Hello :) I am your local AI. How can I help you today?
        </span>
      </div>
    </div>

    <button id="scroll-bottom-btn" aria-label="Scroll to latest message" title="Scroll to bottom">↓</button>

    <div class="input-container">
    <textarea
      id="user-input"
      placeholder="Ask local AI Assistant..."
      autocomplete="off"
      rows="1"
      aria-label="Type your message"
  > </textarea>
  <button id="send-btn">Send</button>
</div>
  </div>

  <script src="script.js"></script>
</body>

</html>
