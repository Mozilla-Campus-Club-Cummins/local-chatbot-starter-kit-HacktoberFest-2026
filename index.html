<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <button id="clear-chat-btn">Clear Chat</button>
      <h2>Local AI Assistant</h2>
      <button id="theme-toggle">🌙 Dark/Light mode</button>
    </header>

    <div id="chat-window">
      <div class="message ai">
        <span class="message-text">Hello :) I am your local AI. How can I help you today?</span>
      </div>
    </div>

    <div class="input-container">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask local AI Assistant..." 
        autocomplete="off" 
      />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
